name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format source
        run: cargo fmt --all
      - name: Test
        run: cargo test
      - name: Build release executable
        run: cargo build --release
      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/recon.exe dist/RECON.exe
          Copy-Item README.md dist/README.md
          Copy-Item CODE_SIGNING.md dist/CODE_SIGNING.md
          $hash = (Get-FileHash dist/RECON.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RECON.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Write-Host "Unsigned build; SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: RECON-Windows-x64
          path: dist/
          retention-days: 30
