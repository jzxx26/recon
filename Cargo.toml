[package]
name = "recon"
version = "0.1.0"
edition = "2021"
description = "Local-first VALORANT match tracker"

[dependencies]
eframe = "0.31"
egui_plot = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }
urlencoding = "2.1"
